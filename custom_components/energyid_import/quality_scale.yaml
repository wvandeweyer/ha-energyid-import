rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Every 6 hours; EnergyID refreshes Fluvius data once a day.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: No requirements; the client is a thin aiohttp wrapper in api.py.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 100% line and branch coverage is a CI gate.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud service without discovery.
  discovery:
    status: exempt
    comment: A cloud service without discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: todo
    comment: A meter added to the record appears only after selecting it in the options.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The integration only creates a few sensors, all of them useful by default.
  entity-translations: done
  exception-translations:
    status: todo
    comment: Service errors are translated; setup and sync failures are not yet.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
