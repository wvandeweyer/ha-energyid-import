[project]
name = "ha-energyid-import"
version = "0.1.1"
description = "Import EnergyID meter data into Home Assistant long-term statistics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13.2"
dependencies = []

[dependency-groups]
dev = [
  "codespell==2.4.3",
  "mypy==2.4.1",
  "pre-commit==4.7.0",
  "ruff==0.17.6",
  "yamllint==1.38.0",
]
test = [
  "hypothesis==6.170.17",
  "pytest-homeassistant-custom-component==0.13.316",
]

[tool.uv]
default-groups = ["dev", "test"]
package = false
# The lockfile pins the minimum supported HA release; CI installs the latest
# stable release on top of it in a separate job.
environments = ["python_version == '3.13'"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213",      # conflict with D211 and D212
  "COM812", "ISC001",  # conflict with the formatter
  "CPY001",            # no per-file copyright header; the licence lives in LICENSE
  "TC001", "TC002", "TC003",  # imports stay runtime imports, as in HA core
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-returns = 4
max-statements = 30

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.create_task".msg = "Use entry.async_create_background_task."
"asyncio.ensure_future".msg = "Use entry.async_create_background_task."
"asyncio.gather".msg = "Requests run sequentially."
"time.sleep".msg = "Never block the event loop."
"datetime.datetime.now".msg = "Take `now` as an argument or use dt_util."
"datetime.datetime.utcnow".msg = "Take `now` as an argument or use dt_util."
"datetime.datetime.today".msg = "Take `now` as an argument or use dt_util."
"requests".msg = "Use the injected aiohttp session."
"urllib.request".msg = "Use the injected aiohttp session."
"pytz".msg = "Use zoneinfo."
"dateutil".msg = "Use the standard library."

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
local_partial_types = true
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
  "deprecated", "explicit-override", "ignore-without-code",
  "mutable-override", "possibly-undefined", "redundant-expr",
  "redundant-self", "truthy-bool", "truthy-iterable", "unused-awaitable",
]
files = ["custom_components", "tests", "scripts"]
# typings/ holds stubs for test dependencies that ship without py.typed.
mypy_path = ["$MYPY_CONFIG_FILE_DIR", "$MYPY_CONFIG_FILE_DIR/typings"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# HA imposes dict[str, Any] in these method signatures.
module = [
  "custom_components.energyid_import.config_flow",
  "custom_components.energyid_import.diagnostics",
]
disallow_any_explicit = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config --cov --cov-branch"
filterwarnings = [
  "error",
  # Hypothesis on Python 3.14 warns about its own internal PRNG.
  "ignore:It looks like `register_random`:hypothesis.errors.HypothesisWarning",
]
xfail_strict = true
timeout = 10
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/energyid_import"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.codespell]
# Dutch text is checked by hand; codespell only knows English.
skip = ".venv,uv.lock,nl.json,SPEC.md"
ignore-words-list = "hass"
